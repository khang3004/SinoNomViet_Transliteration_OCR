# OCR Review — one service, no database.
#
#   docker compose up --build -d
#   docker compose logs -f review
#
# Secrets come from an untracked .env (see .env.example). Never bake them into
# the image.

services:
  review:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    env_file:
      - .env

    # Bound to loopback: a reverse proxy (Caddy/nginx) terminates TLS for the
    # public domain and forwards here. Publishing 0.0.0.0 would expose the app
    # directly, and /img/* is deliberately session-free.
    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      # Reviews, assignments, the corpus snapshot and the mirrored images all
      # live here. This MUST survive container replacement — it is the work.
      - ./data:/data

    # Light: no models, no image processing. The corpus snapshot and the
    # append-only logs are the only sizeable things held in memory.
    deploy:
      resources:
        limits:
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
