# Han Scanner — single service, no database needed.
#
# Usage:
#   docker compose up --build
#   open http://localhost:8000

services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    # Mount source for live dev (restart to pick up changes)
    volumes:
      - ./app:/srv/app
