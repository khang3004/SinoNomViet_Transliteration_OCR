<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Han Scanner</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --plane: #f9f9f7;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19; --plane: #0d0d0d;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --critical: #d03b3b;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--plane); color: var(--ink);
    min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 2rem; width: min(380px, 100%);
  }
  h1 { font-size: 1.15rem; margin-bottom: 0.25rem; }
  .sub { color: var(--ink-2); font-size: 0.85rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--ink-2); }
  input {
    width: 100%; padding: 0.6rem 0.7rem; font-size: 0.95rem; font-family: inherit;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--plane); color: var(--ink); margin-bottom: 1rem;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; padding: 0.65rem; font-size: 0.92rem; font-weight: 600; font-family: inherit;
    border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:hover { filter: brightness(0.94); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error {
    display: none; margin-top: 1rem; padding: 0.6rem 0.7rem; border-radius: 6px;
    font-size: 0.85rem; color: var(--critical);
    border: 1px solid var(--critical); background: color-mix(in srgb, var(--critical) 8%, transparent);
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Han Scanner</h1>
    <p class="sub">Sign in to view the pipeline.</p>

    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus />

    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required />

    <button type="submit" id="btn">Sign in</button>
    <p class="error" id="err" role="alert"></p>
  </form>

<script>
const form = document.getElementById("form");
const btn  = document.getElementById("btn");
const err  = document.getElementById("err");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true; btn.textContent = "Signing in…";
  err.classList.remove("show");
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("u").value,
        password: document.getElementById("p").value,
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Sign-in failed (${res.status})`);
    }
    window.location.href = "/";
  } catch (e) {
    err.textContent = e.message;
    err.classList.add("show");
    btn.disabled = false; btn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
