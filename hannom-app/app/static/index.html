<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Han Scanner — Facebook Image Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #1e293b; padding: 1.5rem; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
    .subtitle { color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem; }

    .card { background: #fff; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; }
    textarea { width: 100%; height: 220px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0.75rem; font-family: "Cascadia Code", "Fira Code", monospace; font-size: 0.82rem; resize: vertical; }
    textarea:focus { outline: 2px solid #3b82f6; border-color: transparent; }

    .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    button { border: none; border-radius: 6px; padding: 0.55rem 1.2rem; font-size: 0.9rem; cursor: pointer; font-weight: 600; }
    button:hover { filter: brightness(0.93); }
    .btn-scan { background: #dc2626; color: #fff; }
    .btn-scan:disabled { background: #94a3b8; cursor: wait; }
    .btn-clear { background: #e2e8f0; color: #475569; }
    .btn-sample { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

    .spinner { display: none; margin-left: 0.5rem; }
    .spinner.show { display: inline-block; }
    .spinner::after { content: ""; display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result area */
    .result-area { margin-top: 1rem; }
    .result-card { padding: 1rem 1.25rem; border-radius: 8px; margin-bottom: 0.75rem; }
    .result-card.valid { background: #f0fdf4; border: 1px solid #86efac; }
    .result-card.invalid { background: #fef2f2; border: 1px solid #fca5a5; }
    .result-card.error { background: #fffbeb; border: 1px solid #fcd34d; }

    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .badge.yes { background: #16a34a; color: #fff; }
    .badge.no { background: #dc2626; color: #fff; }

    .stat { display: inline-block; margin-right: 1.2rem; font-size: 0.85rem; }
    .stat strong { font-size: 1.1rem; }

    .texts-list { margin-top: 0.5rem; font-size: 0.82rem; color: #475569; max-height: 120px; overflow-y: auto; padding: 0.5rem; background: #f8fafc; border-radius: 4px; }
    .texts-list p { margin-bottom: 0.2rem; }

    .preview-img { max-width: 200px; max-height: 200px; border-radius: 6px; margin-top: 0.5rem; border: 1px solid #e2e8f0; }
    .meta { font-size: 0.78rem; color: #94a3b8; margin-top: 0.4rem; }
    .meta a { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Han Scanner</h1>
    <p class="subtitle">Paste Facebook post JSON below. The scanner will check if the image has Han/Chinese characters.</p>

    <div class="card">
      <label for="json-input">Post JSON (single object or array)</label>
      <textarea id="json-input" placeholder='{"id": "...", "images": ["https://..."], "label": "...", "author": "..."}'></textarea>
      <div class="actions">
        <button class="btn-scan" id="btn-scan" onclick="doScan()">
          Scan <span class="spinner" id="spinner"></span>
        </button>
        <button class="btn-clear" onclick="clearAll()">Clear</button>
        <button class="btn-sample" onclick="loadSample()">Load Sample</button>
      </div>
    </div>

    <div class="result-area" id="result-area"></div>
  </div>

  <script>
    const SAMPLE = {
      "id": "948677faaccae6dc182088aaadf56a98",
      "label": "【\n年歲漸長 心要活得自由】\n年輕時總以為...",
      "images": ["https://scontent.fsgn2-3.fna.fbcdn.net/v/t39.30808-6/765853078_3565650060268868_1058326410674324754_n.jpg?stp=dst-jpg_tt6&cstp=mx1170x1461&ctp=s640x640&_nc_cat=107&ccb=1-7&_nc_sid=aa7b47&_nc_eui2=AeG_W3OLcCHdNZWOtDtpWMjHlJabuzb1CEqUlpu7NvUISolf6vZDfgh9-SI9Twqw86vDGtnc5z_qLs0WizZBoJrW&_nc_ohc=qyCt_624K3oQ7kNvwFomYni&_nc_oc=Adr0agkm3r2GKnv4ENSpIz_mRSUAENSiIHz8_HdcaL5mBctiPMnz8A8KFSrVY3O81ffKWVWQlUgbLjIszCXC1YWq&_nc_zt=23&_nc_ht=scontent.fsgn2-3.fna&_nc_gid=KgnTrR694hmtXhTI_M5ZDQ&_nc_ss=7b2a8&oh=00_AQHojgAPf-PBszKFOBAlCwrbr5MzVIGBPz17JHnutVyg6w&oe=6A812953"],
      "post_link": "https://www.facebook.com/groups/1792625541124212/posts/2786427191744037/?comment_id=2787086311678125",
      "author": "董惠珍"
    };

    function loadSample() {
      document.getElementById("json-input").value = JSON.stringify(SAMPLE, null, 2);
    }

    function clearAll() {
      document.getElementById("json-input").value = "";
      document.getElementById("result-area").innerHTML = "";
    }

    async function doScan() {
      const btn = document.getElementById("btn-scan");
      const spinner = document.getElementById("spinner");
      const raw = document.getElementById("json-input").value.trim();

      if (!raw) { alert("Paste some JSON first!"); return; }

      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        alert("Bad JSON: " + e.message);
        return;
      }

      btn.disabled = true;
      spinner.classList.add("show");
      document.getElementById("result-area").innerHTML = "<p>Scanning...</p>";

      try {
        let results;
        if (Array.isArray(data)) {
          const resp = await fetch("/scan/batch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!resp.ok) throw new Error(await resp.text());
          results = await resp.json();
        } else {
          const resp = await fetch("/scan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!resp.ok) throw new Error(await resp.text());
          results = [await resp.json()];
        }
        renderResults(results);
      } catch (e) {
        document.getElementById("result-area").innerHTML =
          `<div class="result-card error"><strong>Error:</strong> ${e.message}</div>`;
      } finally {
        btn.disabled = false;
        spinner.classList.remove("show");
      }
    }

    function renderResults(results) {
      const area = document.getElementById("result-area");
      area.innerHTML = "";

      for (const r of results) {
        const cls = r.valid_pic ? "valid" : "invalid";
        const badgeCls = r.valid_pic ? "yes" : "no";
        const badgeText = r.valid_pic ? "HAS HAN" : "NO HAN";

        let textsHtml = "";
        if (r.texts && r.texts.length > 0) {
          textsHtml = `<div class="texts-list">${r.texts.map(t => `<p>${esc(t)}</p>`).join("")}</div>`;
        }

        let metaHtml = "";
        if (r.author) metaHtml += `Author: <strong>${esc(r.author)}</strong> `;
        if (r.post_link) metaHtml += `| <a href="${esc(r.post_link)}" target="_blank">View post</a>`;

        area.innerHTML += `
          <div class="result-card ${cls}">
            <div class="result-header">
              <span>
                <span class="stat"><strong>${r.han_words}</strong> Han chars</span>
                <span class="stat"><strong>${r.boxes}</strong> text boxes</span>
              </span>
              <span class="badge ${badgeCls}">${badgeText}</span>
            </div>
            ${textsHtml}
            <img class="preview-img" src="${esc(r.image_url)}" onerror="this.style.display='none'" />
            <div class="meta">${metaHtml}</div>
            <div class="meta">ID: ${esc(r.id)}</div>
          </div>
        `;
      }
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
